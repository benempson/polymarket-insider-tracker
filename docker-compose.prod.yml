# Production compose file for the VM.
# PostgreSQL and Redis are standalone shared containers on the backend-shared
# network. This compose file only manages the tracker service.
#
# Required env vars (set by deploy-tracker.sh before invoking compose):
#   TRACKER_IMAGE       — Docker image tag
#   TRACKER_APP_DIR     — Absolute path to app directory on the VM
#   REDIS_CONTAINER     — Name of the shared Redis container
#   REDIS_NETWORK       — Docker network name where shared services live
#   POSTGRES_CONTAINER  — Name of the shared PostgreSQL container
#
# Usage:
#   TRACKER_IMAGE=ghcr.io/.../polymarket-insider-tracker:main \
#     docker compose -f docker-compose.prod.yml up -d

services:
  tracker:
    image: ${TRACKER_IMAGE:?Set TRACKER_IMAGE}
    container_name: polymarket-tracker
    env_file:
      - ${TRACKER_APP_DIR:?Set TRACKER_APP_DIR}/vars/.env.production
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER:-shared-postgres}:5432/polymarket_tracker
      REDIS_URL: redis://${REDIS_CONTAINER:?Set REDIS_CONTAINER}:6379
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend-shared

networks:
  backend-shared:
    external: true
    name: ${REDIS_NETWORK:-backend_default}
